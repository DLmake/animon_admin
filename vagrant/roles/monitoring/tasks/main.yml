---
# Role: monitoring
# Goal: see how the server and app are doing (metrics + dashboards + uptime).
#
# Each part has its own file in this folder. Replace the TODO task in each file
# with real tasks. Settings for this role are in ../defaults/main.yml.

- name: Server metrics (node_exporter)
  ansible.builtin.include_tasks: node_exporter.yml

- name: Metrics database (Prometheus)
  ansible.builtin.include_tasks: prometheus.yml

- name: Dashboards (Grafana)
  ansible.builtin.include_tasks: grafana.yml

- name: Uptime check of /up
  ansible.builtin.include_tasks: uptime.yml
