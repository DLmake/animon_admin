---
# Animon server setup. Works with both Vagrant (vagrant up) and Multipass (./up.sh).
#
# Each role is one area of a production server:
#   app        - Laravel app, PHP, MySQL, Redis, nginx           (done)
#   workers    - queue worker + task scheduler                    (TODO)
#   security   - firewall, SSH hardening, fail2ban, HTTPS, secrets (TODO)
#   logging    - Laravel daily logs, log rotation, central logs    (TODO)
#   monitoring - Prometheus, node_exporter, Grafana, uptime check  (TODO)
#   backups    - nightly MySQL dumps with retention               (TODO)
#
# Shared variables live in group_vars/all.yml, role settings in roles/<role>/defaults/main.yml.
# Progress checklist: PRODUCTION.md

- hosts: all
  become: yes
  roles:
    - app
    - workers
    - security
    - logging
    - monitoring
    - backups
