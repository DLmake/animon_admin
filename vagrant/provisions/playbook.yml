---
- hosts: all
  become: yes
  #give root to everyone yikes

  #setup some varibles for the app (db login and passkey)
  vars:
    app_dir: /var/www/animon
    db_name: animon
    db_user: animon
    db_pass: secret123
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install packages
      apt:
        name:
          - git 
          - nginx
          - php8.2-fpm
          - php8.2-mysql
          - php8.2-redis
          - php8.2-curl
          - php8.2-mbstring
          - php8.2-xml
          - php8.2-zip
          - mysql-server
          - redis-server
          - nodejs
          - npm
          - composer
          - python3-pymysql   # needed for Ansible's mysql_* modules
        state: present

    - name: Start and enable services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - php8.2-fpm
        - mysql
        - redis


    - name: Creata sql database
      mysql_db:
        name: "{{db_name}}"
        login_unix_socket: /var/run/mysqld/mysqld.sock #socket we connec trhough cuz we not root


    - name: Create sql user
      mysql_user: 
        name: "{{db_user}}"
        pasword: "{{db_pass}}"
        priv: "{{db_name}}.*:ALL"
        login_unix_socket: /var/run/mysqld/mysqld.sock #socket we connect through cuz we not root

    - name: Clone animon from git
      git:
        repo: https://github.com/DLmake/animon.git
        dest: "{{ app_dir }}"
        version: main
        force: yes


    #set ownership to www-data so that the aritsan and php can execute
    - name: Set ownership
      file:
        path: "{{ app_dir }}"
        owner: www-data
        group: www-data
        recurse: yes

    #my env file
    - name: Write .env
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        owner: www-data
    
    - name: composer install
      composer:
        command: install
        working_dir: "{{ app_dir }}"
        no_dev: yes

    - name: npm install + build
      shell: |
        cd {{ app_dir }}
        npm ci
        npm run build
      args:
        creates: "{{ app_dir }}/public/build"
    
    - name: Generate app key
      shell: php artisan key:generate --force
      args:
        chdir: "{{ app_dir }}"

    - name: Run migrations and seed
      shell: php artisan migrate --seed --force
      args:
        chdir: "{{ app_dir }}"

    - name: Write Nginx config
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/animon
      notify: Reload nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/animon
        dest: /etc/nginx/sites-enabled/animon
        state: link
      notify: Reload nginx
      
  handlers:
    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded






